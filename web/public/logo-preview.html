<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stocklana Logo Exploration</title>
  <style>
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      gap: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .card {
      background: #111114;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .preview-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      width: 100%;
    }
    .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <h2>Stocklana Logo Design Explorations</h2>
  
  <div class="grid">

      </svg>
      <div class="preview-header">
        <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="#141417" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
          <path d="M12 14C12 12.8954 12.8954 12 14 12H32.5C33.7225 12 34.5457 13.2435 34.0526 14.3601L31.8762 19.2834C31.5494 20.0227 30.8122 20.5 30 20.5H19C17.3431 20.5 16 21.8431 16 23.5C16 25.1569 17.3431 26.5 19 26.5H34C35.1046 26.5 36 27.3954 36 28.5V32C36 33.1046 35.1046 34 34 34H15.5C14.2775 34 13.4543 32.7565 13.9474 31.6399L16.1238 26.7166C16.4506 25.9773 17.1878 25.5 18 25.5H29C30.6569 25.5 32 24.1569 32 22.5C32 20.8431 30.6569 19.5 29 19.5H14C12.8954 19.5 12 18.6046 12 17.5V14Z" fill="#FFFFFF"/>
        </svg>
        <span class="name">Stocklana Fantasy</span>
      </div>
    </div>

        </svg>
        <span class="name">Stocklana Fantasy</span>
      </div>
    </div>

          <rect width="48" height="48" rx="12" fill="#141417" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
          <path d="M13 18.5V15C13 13.3431 14.3431 12 16 12H31C32.6569 12 34 13.3431 34 15V18.5C34 19.0523 33.5523 19.5 33 19.5H18C16.8954 19.5 16 20.3954 16 21.5C16 22.0523 15.5523 22.5 15 22.5H14C13.4477 22.5 13 22.0523 13 21.5V18.5Z" fill="#FFFFFF"/>

      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="12" fill="#141417" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
        <!-- Top Solana diagonal bar -->
        <path d="M12 16.5C12 15.67 12.67 15 13.5 15H32.2C33.26 15 33.98 16.08 33.58 17.06L32.42 19.94C32.17 20.58 31.55 21 30.86 21H13.5C12.67 21 12 20.33 12 19.5V16.5Z" fill="#FFFFFF"/>

          <rect width="48" height="48" rx="12" fill="#141417" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
          <path d="M12 16.5C12 15.67 12.67 15 13.5 15H32.2C33.26 15 33.98 16.08 33.58 17.06L32.42 19.94C32.17 20.58 31.55 21 30.86 21H13.5C12.67 21 12 20.33 12 19.5V16.5Z" fill="#FFFFFF"/>
          <path d="M36 22.5C36 21.67 35.33 21 34.5 21H15.8C14.74 21 14.02 22.08 14.42 23.06L15.58 25.94C15.83 26.58 16.45 27 17.14 27H34.5C35.33 27 36 26.33 36 25.5V22.5Z" fill="#FFFFFF" fill-opacity="0.9"/>

</body>
